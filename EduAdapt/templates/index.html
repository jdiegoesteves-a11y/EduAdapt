{% extends "base.html" %}
{% block content %}
<div class="hero-section text-center d-flex flex-column justify-content-center align-items-center" style="min-height: 80vh;">
    <div style="margin-bottom: 2rem;">
        <h1 class="title">Bienvenido a <span class="highlight">EduAdapt</span></h1>
        <p class="subtitle mt-3">Aprende según lo que necesitas. Tu tutor adaptativo con IA.</p>
    </div>
    
    <div class="card login-card w-100">
        <form method="POST">
            <div class="form-group mb-4">
                <label><i class="fas fa-user text-primary me-2"></i> Nombre de Usuario</label>
                <input type="text" name="username" class="form-control form-control-lg" required placeholder="Ingresa tu usuario">
            </div>
            <div class="form-group mb-4">
                <label><i class="fas fa-lock text-primary me-2"></i> Contraseña</label>
                <input type="password" name="password" class="form-control form-control-lg" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary btn-block btn-lg"><i class="fas fa-sign-in-alt me-2"></i> Iniciar Sesión</button>
        </form>
    </div>
    
    <div class="mt-4">
        <p class="text-muted">¿No tienes cuenta? <a href="{{ url_for('register') }}" class="btn btn-outline-secondary ms-2"><i class="fas fa-user-plus me-1"></i> Regístrate aquí</a></p>
    </div>
</div>
{% endblock %}
