{% extends "base.html" %}
{% block content %}
<div class="hero-section text-center">
    <h1 class="title">Bienvenido a <span class="highlight">EduAdapt</span></h1>
    <p class="subtitle">Aprende según lo que necesitas. Tu tutor adaptativo.</p>
    
    <div class="card login-card">
        <form method="POST">
            <div class="form-group">
                <label>Nombre de Usuario:</label>
                <input type="text" name="username" class="form-control" required placeholder="Tu usuario">
            </div>
            <div class="form-group">
                <label>Contraseña:</label>
                <input type="password" name="password" class="form-control" required placeholder="Tu contraseña">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Iniciar Sesión</button>
        </form>
    </div>
    
    <div class="mt-4">
        <p>¿No tienes cuenta? <a href="{{ url_for('register') }}" class="btn btn-outline-secondary btn-sm"><i class="fas fa-user-plus"></i> Regístrate aquí</a></p>
    </div>
</div>
{% endblock %}
