{% extends "base.html" %}
{% block content %}
<div class="hero-section text-center">
    <h2 class="title">Registro en <span class="highlight">EduAdapt</span></h2>
    <p class="subtitle">Crea tu cuenta para acceder a la plataforma.</p>
    
    <div class="card login-card text-left">
        <form method="POST">
            <div class="form-group">
                <label>Rol:</label>
                <select name="rol" class="form-control" id="rolSelect" required>
                    <option value="ESTUDIANTE">Alumno</option>
                    <option value="PROFESOR">Profesor</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Nombre Completo:</label>
                <input type="text" name="nombre" class="form-control" required placeholder="Ej. Juan Pérez">
            </div>
            
            <div class="form-group" id="cursoGroup">
                <label>Curso:</label>
                <select name="curso" class="form-control">
                    <option value="1er Año">1er Año</option>
                    <option value="2do Año">2do Año</option>
                    <option value="3er Año">3er Año</option>
                    <option value="4to Año">4to Año</option>
                    <option value="5to Año">5to Año</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Nombre de Usuario (Para iniciar sesión):</label>
                <input type="text" name="username" class="form-control" required placeholder="Ej. juanp123">
            </div>
            
            <div class="form-group">
                <label>Contraseña:</label>
                <input type="password" name="password" class="form-control" required placeholder="Tu contraseña segura">
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">Registrarse</button>
        </form>
    </div>
    
    <div class="mt-4">
        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary btn-sm"><i class="fas fa-arrow-left"></i> Volver al Inicio</a>
    </div>
</div>

<script>
    // Mostrar/ocultar el campo de curso dependiendo del rol
    document.getElementById('rolSelect').addEventListener('change', function() {
        var cursoGroup = document.getElementById('cursoGroup');
        if (this.value === 'PROFESOR') {
            cursoGroup.style.display = 'none';
        } else {
            cursoGroup.style.display = 'block';
        }
    });
</script>
{% endblock %}
